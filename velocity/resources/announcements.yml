# The master announcements.yml. Servers send their saved changes here and receive the keys that name them, so edit it
# here or on any server. Every announcement below is switched off (enable: false); turn one on to use it.
#
#   enable:   false switches it off everywhere, commands included.
#   delay:    seconds before the first automatic run. With delay and repeat both 0 it only runs from /xannounce.
#   repeat:   seconds between automatic runs; 0 runs it once.
#   servers:  server names from velocity.toml, with * and ? wildcards (skyblock-*). Empty means every server.
#   actions:  run in order, each one of:
#               delay:     pause; seconds, or a number and unit such as "2s 10t" (t ticks, ms, s, m, h, d)
#               command:   a console command
#               message:   a chat line, or a list of lines. &-codes, &#RRGGBB and MiniMessage work
#               condition: a test, with 'true' and 'false' lists of actions run for each outcome (see rank-example)
#             {name}, {uuid}, %player_name% and other placeholders resolve for the player it is run for:
#             /xannounce <key> [player]. Without a player, each viewer gets their own in a message.
"discord":
  enable: false
  delay: 300
  repeat: 1800
  actions:
  - message:
    - "========================================"
    - ""
    - "Join the Discord: https://discord.gg/example"
    - ""
    - "========================================"
"rank-example":
  enable: false
  servers:
  - "survival-*"
  actions:
  - condition: "%discordsrv_linked%"
    'true':
    - message: "%player_name% purchased a rank!"
    - command: "playsound minecraft:entity.player.levelup master @a"
    'false':
    - message:
      - "&cYou need to link your Discord first"
      - "<click:open_url:'https://discord.gg/example'>Join here</click>"
